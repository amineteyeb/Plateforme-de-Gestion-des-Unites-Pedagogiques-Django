<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>

<script>
    $("#password").keyup(function () {
    var user_pass = $("#password").val();
    var user_pass2 = $("#confirm_password").val();

    if (user_pass == user_pass2) {
      $("#button1").prop('disabled', false)//use prop()
      $('#message').html('Identiques').css('color', 'green');
    } else {
      $("#button1").prop('disabled', true)//use prop()
      $('#message').html('Les Deux champs doivent être identiques').css('color', 'red');
    }
  });

  $("#confirm_password").keyup(function () {
    var user_pass = $("#password").val();
    var user_pass2 = $("#confirm_password").val();

    if (user_pass == user_pass2) {
      $("#button1").prop('disabled', false)//use prop()
      $('#message').html('Identiques').css('color', 'green');
    } else {
      $("#button1").prop('disabled', true)//use prop()
      $('#message').html('Les Deux champs doivent être identiques').css('color', 'red');
    }
  });
</script>
  
<script>const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#password');
  
    togglePassword.addEventListener('click', function (e) {
      // toggle the type attribute
      const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
      password.setAttribute('type', type);
      // toggle the eye slash icon
      this.classList.toggle('fa-eye-slash');
      
  });</script>
  <script>const togglePassword1 = document.querySelector('#togglePassword1');
    const password1 = document.querySelector('#confirm_password');
  
    togglePassword1.addEventListener('click', function (e) {
      // toggle the type attribute
      const type1 = password1.getAttribute('type') === 'password' ? 'text' : 'password';

  });</script>
